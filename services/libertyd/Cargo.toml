[package]
name = "libertyd"
version = "0.2.0"
edition = "2021"
description = "Démon d'intelligence système de Liberty — esprit Claude (Fable 5) + boucle de décision + exécution sous capacités"
default-run = "libertyd"

[lib]
name = "libertyd"
path = "src/lib.rs"

[[bin]]
name = "libertyd"
path = "src/main.rs"

[[bin]]
name = "lish"
path = "src/bin/lish.rs"

# Le transport réseau vers Anthropic est derrière un feature, pour que le
# build par défaut reste léger et hors-ligne. Pour le vrai OS, on compile
# avec : `cargo build --release --features claude`.
[features]
default = []
claude = ["dep:ureq"]

[dependencies]
serde_json = "1"
ureq = { version = "2", optional = true, features = ["json", "tls"] }

[profile.release]
opt-level = 3
lto = true
strip = true
